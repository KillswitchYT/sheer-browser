name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

# A newer push replaces an older run, so two builds never fight over the logs branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SHEER_KEYSTORE_B64: ${{ secrets.SHEER_KEYSTORE_B64 }}
      SHEER_KEYSTORE_PASSWORD: ${{ secrets.SHEER_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # The runner image ships an Android SDK with platform 37.2 and build-tools 37.0.0. Accept licences and list what is installed.
      - name: Prepare Android SDK
        continue-on-error: true
        run: |
          {
            SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            echo "SDK=$SDK  java=$(java -version 2>&1 | head -1)"
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SM" --licenses > /dev/null || yes | sudo env "PATH=$PATH" "JAVA_HOME=$JAVA_HOME" "$SM" --licenses > /dev/null || true
            echo "--- installed:"; ls "$SDK/platforms" "$SDK/build-tools" || true
            echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          } 2>&1 | tee sdk.log

      # Nothing signed with a public key may ever ship, so a missing key stops the build here instead of falling back.
      - name: Load the signing key
        run: |
          if [ -z "$SHEER_KEYSTORE_B64" ] || [ -z "$SHEER_KEYSTORE_PASSWORD" ]; then
            echo "The signing secrets SHEER_KEYSTORE_B64 and SHEER_KEYSTORE_PASSWORD are not set on this repo. Not building." | tee build.log
            exit 1
          fi
          echo "$SHEER_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sheer.keystore"
          echo "SHEER_KEYSTORE=$RUNNER_TEMP/sheer.keystore" >> "$GITHUB_ENV"

      # The newest stable GeckoView on Mozilla maven, so the engine is current. If the lookup fails, gradle.properties decides.
      - name: Find the newest GeckoView
        id: gv
        run: |
          v=$(bash tools/ci/gecko-version.sh || true)
          echo "newest stable GeckoView on Mozilla maven: ${v:-none found}" | tee gecko.txt
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build the app (optimized)
        run: |
          set -o pipefail
          chmod +x gradlew
          args=""
          if [ -n "${{ steps.gv.outputs.version }}" ]; then args="-PgeckoVersion=${{ steps.gv.outputs.version }}"; fi
          ./gradlew assembleRelease --no-daemon --stacktrace $args 2>&1 | tee build.log

      - name: Publish the APK as a release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Sheer.apk
          files="Sheer.apk"
          m=app/build/outputs/mapping/release/mapping.txt
          if [ -f "$m" ]; then cp "$m" mapping.txt; files="$files mapping.txt"; fi
          gh release delete latest --cleanup-tag -y --repo "${{ github.repository }}" 2>/dev/null || true
          gh release create latest $files --repo "${{ github.repository }}" --target "$GITHUB_SHA" --prerelease \
            --title "Latest build" --notes "Built from commit ${GITHUB_SHA::7}. $(cat gecko.txt). Optimized and signed with the project key, so it updates over the previous build."

      - name: Show errors on the run page
        if: always()
        run: |
          {
            echo "### GeckoView"
            echo '```'
            cat gecko.txt 2>/dev/null || echo "not looked up"
            echo '```'
            echo "### Errors"
            echo '```'
            cat sdk.log build.log 2>/dev/null | grep -E '^e: |^FAILURE|What went wrong|error:|failed|Failed|not set' | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Lets an assistant read the result without downloading a zip: branch build-logs holds errors.txt and the full logs.
      - name: Publish the logs to branch build-logs
        if: always()
        run: |
          mkdir -p /tmp/out
          cp build.log /tmp/out/build.log 2>/dev/null || echo "no build log was produced (build step did not run)" > /tmp/out/build.log
          cp sdk.log /tmp/out/sdk.log 2>/dev/null || echo "no sdk log" > /tmp/out/sdk.log
          cp gecko.txt /tmp/out/gecko.txt 2>/dev/null || echo "no gecko lookup" > /tmp/out/gecko.txt
          { cat /tmp/out/sdk.log /tmp/out/build.log | grep -E '^e: |What went wrong|error:|FAILURE|failed|Failed|not set' | head -80 || true; } > /tmp/out/errors.txt
          [ -s /tmp/out/errors.txt ] || echo "no errors found" > /tmp/out/errors.txt
          echo "run $GITHUB_RUN_ID, commit $GITHUB_SHA" > /tmp/out/run.txt
          cd /tmp/out
          git init -q -b build-logs
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add .
          git commit -qm "logs for run $GITHUB_RUN_ID"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build-logs

  # The same code built for an x86_64 emulator, opened and fed a web link. Not a phone, but a crash here is real and comes with the phone's own log.
  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    continue-on-error: true
    env:
      SHEER_KEYSTORE_B64: ${{ secrets.SHEER_KEYSTORE_B64 }}
      SHEER_KEYSTORE_PASSWORD: ${{ secrets.SHEER_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Load the signing key
        run: |
          echo "$SHEER_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sheer.keystore"
          echo "SHEER_KEYSTORE=$RUNNER_TEMP/sheer.keystore" >> "$GITHUB_ENV"

      - name: Find the newest GeckoView
        id: gv
        run: |
          v=$(bash tools/ci/gecko-version.sh || true)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # Two emulator builds of the same code: the normal layout, and one that starts with the address bar at the top.
      - name: Build the optimized app for the emulator (x86_64), both layouts
        run: |
          chmod +x gradlew
          args=""
          if [ -n "${{ steps.gv.outputs.version }}" ]; then args="-PgeckoVersion=${{ steps.gv.outputs.version }}"; fi
          ./gradlew assembleRelease --no-daemon -PtestAbi=x86_64 $args 2>&1 | tail -15
          cp app/build/outputs/apk/release/app-release.apk smoke-bottom.apk
          ./gradlew assembleRelease --no-daemon -PtestAbi=x86_64 -PtestTop=true $args 2>&1 | tail -15
          cp app/build/outputs/apk/release/app-release.apk smoke-top.apk
          ls -l smoke-bottom.apk smoke-top.apk

      # Lets the emulator use the machine's hardware acceleration.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          script: timeout 1500 bash tools/ci/smoke-all.sh

      - name: Show the result on the run page
        if: always()
        run: |
          {
            echo "### Smoke test"
            echo '```'
            cat smoke-result-*.txt 2>/dev/null || echo "the smoke test did not run"
            echo '```'
            echo '```'
            head -60 smoke-crash-*.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the smoke test to branch build-logs
        if: always()
        run: |
          mkdir -p /tmp/st && cd /tmp/st
          URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git clone -q --depth 1 --branch build-logs "$URL" . || git init -q -b build-logs
          rm -f smoke-*.png smoke-*.txt smoke-*.log
          cp "$GITHUB_WORKSPACE"/smoke-*.png "$GITHUB_WORKSPACE"/smoke-result-*.txt "$GITHUB_WORKSPACE"/smoke-crash-*.txt \
             "$GITHUB_WORKSPACE"/smoke-test-*.log "$GITHUB_WORKSPACE"/smoke-logcat-*.txt . 2>/dev/null || true
          ls smoke-result-*.txt > /dev/null 2>&1 || echo "no result: the smoke test did not run" > smoke-result-none.txt
          echo "run $GITHUB_RUN_ID, commit $GITHUB_SHA" > smoke-run.txt
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git add -A; git commit -qm "smoke test for run $GITHUB_RUN_ID" || true
          git push "$URL" HEAD:build-logs
